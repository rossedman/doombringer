# The docs site: every page in docs/.
# Published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally: make docs-serve
site_name: Doombringer
site_description: A ladder filter that summons what isn't there, for patch.Init and VCV Rack.
site_url: https://rossedman.io/doombringer/
repo_url: https://github.com/rossedman/doombringer
repo_name: rossedman/doombringer
edit_uri: edit/main/docs/

# Graphic sources and their render script are not pages.
exclude_docs: |
  /assets/src/
  /assets/render.sh

theme:
  name: material
  logo: assets/site/logo.svg
  favicon: assets/site/favicon.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/site/brand.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/docs.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Fail the build when an included root file is missing.
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Strict builds fail on broken links and #anchors between pages.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Listen: listen.md
  - Summon:
      - Getting started: getting-started.md
      - Reading the panel: panel.md
      - patch.Init control map: patch-init.md
      - VCV Rack: vcv-rack.md
  - Rituals:
      - Five patches: patches.md
      - Calibration: calibration.md
  - Anatomy:
      - How it works: how-it-works.md
      - Measurements: measurements.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Changelog: changelog.md
      - Code of conduct: code-of-conduct.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/doombringer
  generator: false
