name: Feature request
description: A new way for the module to misbehave, or a better way to control it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is awkward? Describe the sound or the patch you are after.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How it could work, including which target (patch.Init, VCV or both) and where it would live on the panel or the shift layer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get there, including patching it with other modules.
