version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 5

  # libDaisy, the patch.Init hardware library.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 2

  # requirements-docs.txt and requirements-tools.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 5
